<svg viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>
  <g stroke="#444" stroke-width="1.5">
    <rect x="20"  y="60" width="200" height="170" rx="10" fill="#e8f1fb"/>
    <rect x="260" y="60" width="210" height="170" rx="10" fill="#eaf6ec"/>
    <rect x="510" y="60" width="210" height="170" rx="10" fill="#fdf1e3"/>
    <rect x="760" y="60" width="180" height="170" rx="10" fill="#f3ecf8"/>
  </g>
  <g fill="#222" font-size="16" font-weight="700" text-anchor="middle">
    <text x="120" y="88">Sensors</text>
    <text x="365" y="88">Estimation</text>
    <text x="615" y="88">Control</text>
    <text x="850" y="88">Robot (MuJoCo)</text>
  </g>
  <g fill="#222" font-size="13" text-anchor="middle">
    <text x="120" y="120">Wrist RGB-D camera</text>
    <text x="120" y="142">(pixel + depth, noisy)</text>
    <text x="120" y="170">Joint encoders (angle)</text>
    <text x="120" y="198">Rail encoder (position)</text>

    <text x="365" y="120">Can Kalman filter</text>
    <text x="365" y="142">(3D position + covariance)</text>
    <text x="365" y="170">Joint observer</text>
    <text x="365" y="192">(angle + speed)</text>
    <text x="365" y="218">Rail Kalman filter</text>

    <text x="615" y="120">PBVS (Jacobian pseudo-inverse)</text>
    <text x="615" y="148">Joint LQR + gravity</text>
    <text x="615" y="170">feed-forward (torque)</text>
    <text x="615" y="198">Rail LQR (force)</text>

    <text x="850" y="120">UR3e arm on</text>
    <text x="850" y="142">linear rail</text>
    <text x="850" y="176">Pick and place</text>
    <text x="850" y="198">a can</text>
  </g>
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="220" y1="145" x2="258" y2="145"/>
    <line x1="470" y1="145" x2="508" y2="145"/>
    <line x1="720" y1="145" x2="758" y2="145"/>
    <path d="M850 232 L850 290 L120 290 L120 232"/>
  </g>
  <text x="485" y="282" font-size="13" fill="#222" text-anchor="middle">Measurements fed back each step. Controllers use estimates only; simulator ground truth is used for evaluation.</text>
</svg>
